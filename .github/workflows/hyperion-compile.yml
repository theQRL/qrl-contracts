name: Hyperion Compile

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hypc:
    name: hypc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HYPC_JS_REF: f0a69fefe9a31d0538981733323cdab325ed00ea # v0.3.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build Hyperion compiler
        run: |
          git init /tmp/hypc-js
          git -C /tmp/hypc-js remote add origin https://github.com/theQRL/hypc-js.git
          git -C /tmp/hypc-js fetch --depth 1 origin "$HYPC_JS_REF"
          git -C /tmp/hypc-js checkout --detach FETCH_HEAD
          npm --prefix /tmp/hypc-js ci
          npm --prefix /tmp/hypc-js run build
          /tmp/hypc-js/dist/hypc.js --version

      - name: Compile Hyperion sources
        env:
          HYPC: /tmp/hypc-js/dist/hypc.js
        run: npm run compile

      - name: Test address string helpers
        env:
          HYPC: /tmp/hypc-js/dist/hypc.js
        run: npm test

  # Runs test/vm/*.t.hyp in go-qrl's VM (npm run test:vm).
